    <!-- formulario de inicio de sesión -->

    <main class="contenedor-formulario">

        <form id="formContacto" novalidate>
            <div class="grupo-campo">
                <h2>FORMULARIO DE CONTACTO</h2>
                <label for="nombreContacto">NOMBRE COMPLETO</label>
                <input type="text" id="nombreContacto" name="nombreContacto" placeholder="Ingresa tu nombre completo" autocomplete="name">
                <span class="mensaje-error" id="errorNombreContacto"></span>
            </div>

            <div class="grupo-campo">
                <label for="emailContacto">CORREO</label>
                <input type="email" id="emailContacto" name="emailContacto" placeholder="ejemplo@correo.com" autocomplete="email">
                <span class="mensaje-error" id="errorEmailContacto"></span>
            </div>

            <div class="grupo-campo">
                <label for="mensajeContacto">CONTENIDO</label>
                <textarea id="mensajeContacto" name="mensajeContacto" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
                <span class="mensaje-error" id="errorMensajeContacto"></span>
            </div>

            <button type="submit" class="btn-iniciar-sesion">Ingresar</button>
            <p id="mensajeExitoLogin" class="mensaje-exito"></p>
        </form>
    </main>
