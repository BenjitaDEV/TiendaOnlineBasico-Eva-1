    <!-- formulario de registro -->

    <main class="contenedor-formulario">
        <form id="formRegistro" novalidate>

            <div class="grupo-campo">
                <h2>REGISTRO</h2>
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa nombre" autocomplete="name">
                <span class="mensaje-error" id="errorNombre"></span>
            </div>

            <div class="grupo-campo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="email">
                <span class="mensaje-error" id="errorEmail"></span>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="*******" autocomplete="new-password">
                <span class="mensaje-error" id="errorPassword"></span>
            </div>

            <div class="grupo-campo">
                <label for="confirmarPassword">Confirmar Contraseña:</label>
                <input type="password" id="confirmarPassword" name="confirmarPassword" placeholder="*******" autocomplete="new-password">
                <span class="mensaje-error" id="errorConfirmarPassword"></span>
            </div>

            <div class="grupo-campo">
                <label for="telefono">Teléfono (opcional):</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678" autocomplete="tel">
                <span class="mensaje-error" id="errorTelefono"></span>
            </div>

            <!-- Fila de Región y Comuna -->
            <div class="fila-desplegables">
                <div class="grupo-campo">
                    <select id="region" name="region">
                        <option value="" disabled selected>-- Seleccione la región --</option>
                        <option value="XV">Arica y Parinacota</option>
                        <option value="I">Tarapacá</option>
                        <option value="II">Antofagasta</option>
                        <option value="III">Atacama</option>
                        <option value="IV">Coquimbo</option>
                        <option value="V">Valparaiso</option>
                        <option value="RM">Región Metropolitana de Santiago</option>
                        <option value="VI">Libertador General Bernardo O'Higgins</option>
                        <option value="VII">Maule</option>
                        <option value="XVI">Ñuble</option>
                        <option value="VIII">Biobío</option>
                        <option value="IX">La Araucanía</option>
                        <option value="XIV">Los Ríos</option>
                        <option value="X">Los Lagos</option>
                        <option value="XI">Aysén del General Carlos Ibáñez del Campos</option>
                        <option value="XII">Magallanes y de la Antártica Chilena</option>
                    </select>
                    <span class="mensaje-error" id="errorRegion"></span>
                </div>

                <div class="grupo-campo">
                    <select id="comuna" name="comuna">
                        <option value="" disabled selected>-- Seleccione la comuna --</option>
                    </select>
                    <span class="mensaje-error" id="errorComuna"></span>
                </div>
            </div>

            <button type="submit" class="btn-registrar">Crear Cuenta</button>
            <p id="mensajeExitoRegistro" class="mensaje-exito"></p>
        </form>
    </main>
